services:
  nginx:
    image: nginx:1.28.1-alpine
    environment:
      - TZ=Europe/Sofia
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cloudflare-certs:/etc/ssl/cloudflare:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - santase_network

  frontend:
    image: bkirilov/santase_frontend:latest
    container_name: santase_frontend
    restart: always
    environment:
      - TZ=Europe/Sofia
    # No ports exposed! The main nginx proxy handles external traffic.
    networks:
      - santase_network

  backend:
    image: ${DOCKERHUB_USERNAME}/santase_backend:latest
    container_name: santase_backend
    restart: always
    env_file: .env
    volumes:
      - /home/ubuntu/app/backend_logs:/app/logs
    environment:
      - TZ=Europe/Sofia
      - JAVA_OPTS=-Duser.timezone=Europe/Sofia
    networks:
      - santase_network

networks:
  santase_network:
    driver: bridge