# Deployed to /home/ubuntu/santase. Amarok lives in /home/ubuntu/app and both
# projects declare services called "frontend" and "backend", so they must never
# share a directory: whichever deployed last would own the compose file there.
name: santase

services:
  frontend:
    image: bkirilov/santase_frontend:latest
    container_name: santase_frontend
    restart: always
    environment:
      - TZ=Europe/Sofia
    networks:
      - santase_network

  backend:
    image: ${DOCKERHUB_USERNAME}/santase_backend:latest
    container_name: santase_backend
    restart: always
    env_file: .env
    volumes:
      - /home/ubuntu/santase/backend_logs:/app/logs
    environment:
      - TZ=Europe/Sofia
      - JAVA_OPTS=-Duser.timezone=Europe/Sofia
    networks:
      - santase_network

networks:
  santase_network:
    # Created originally as project "app"; nginx_proxy is attached to it, so it
    # is adopted as-is rather than recreated under the new project name.
    external: true
    name: app_santase_network