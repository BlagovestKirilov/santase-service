events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    server {
        listen 443 ssl;
        server_name localhost;

        # --- 1. Auth API (Login/Register - NO Token Needed) ---
        location /api/auth/ {
    # 1. Handle Preflight (OPTIONS)
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Content-Length' 0;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        return 204;
    }

    proxy_pass http://host.docker.internal:8080/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # 2. THE CRITICAL FIX: Strip backend headers to prevent duplicates
    proxy_hide_header 'Access-Control-Allow-Origin';
    proxy_hide_header 'Access-Control-Allow-Credentials';

    # 3. Add Nginx's own CORS headers to the successful response
    add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    
    # Ensure Authorization header can be read by React if needed
    add_header 'Access-Control-Expose-Headers' 'Authorization' always;
}


        location /api/game/ {
    add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    proxy_pass http://host.docker.internal:8080/game/;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
}


        # --- 3. WebSocket ---
        location /ws-game/ {
            proxy_pass http://host.docker.internal:8080/ws-game/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            
            # WebSocket CORS is handled by your Java WebSocketConfig
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}