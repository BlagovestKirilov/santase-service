worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate limits
    limit_req_log_level notice;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=game_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=user_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;
    limit_req_status 429;

    # -----------------------------
    # 1. HTTP -> HTTPS Redirect
    # -----------------------------
    server {
        listen 80;
        server_name deck.bg www.deck.bg;

        # LetsEncrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP requests to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -----------------------------
    # 2. HTTPS Server
    # -----------------------------
    server {
        listen 443 ssl http2;
        server_name deck.bg www.deck.bg;

        # SSL Certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/deck.bg/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deck.bg/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # -----------------------------
        # Only allow Cloudflare IPs
        # -----------------------------
        # IPv4
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;

        # IPv6
        set_real_ip_from 2400:cb00::/32;
        set_real_ip_from 2606:4700::/32;
        set_real_ip_from 2803:f800::/32;
        set_real_ip_from 2405:b500::/32;
        set_real_ip_from 2405:8100::/32;
        set_real_ip_from 2a06:98c0::/29;
        set_real_ip_from 2c0f:f248::/32;

        real_ip_header CF-Connecting-IP;

        # Deny all other IPs
        deny all;

        # -----------------------------
        # Global proxy headers
        # -----------------------------
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # -----------------------------
        # Frontend
        # -----------------------------
        location / {
            proxy_pass http://frontend:80;
        }

        # -----------------------------
        # Auth API (rate limit 10r/m)
        # -----------------------------
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend:8080/auth/;
        }

        # -----------------------------
        # Game API
        # -----------------------------
        location /api/game/ {
            limit_req zone=game_limit burst=10 nodelay;
            proxy_pass http://backend:8080/game/;
            proxy_set_header Authorization $http_authorization;
        }

        # -----------------------------
        # User API
        # -----------------------------
        location /api/user/ {
            limit_req zone=user_limit burst=5 nodelay;
            proxy_pass http://backend:8080/user/;
            proxy_set_header Authorization $http_authorization;
        }

        # -----------------------------
        # WebSocket
        # -----------------------------
        location /api/ws-game/ {
            proxy_pass http://backend:8080/ws-game/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }
}
