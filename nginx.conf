worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Новият лимит: 10 заявки в минута на IP
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/m;
    limit_req_zone $binary_remote_addr zone=game_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;
    limit_req_status 429;

    # 1. HTTP -> HTTPS Redirect
    server {
        listen 80;
        server_name deck.bg www.deck.bg;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Основен HTTPS Сървър
    server {
        listen 443 ssl;
        server_name deck.bg www.deck.bg;

        # Пътища до сертификатите
        ssl_certificate /etc/letsencrypt/live/deck.bg/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deck.bg/privkey.pem;

        # Сигурност за SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Глобални хедъри за проксиране
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Frontend
        location / {
            proxy_pass http://frontend:80;
        }

        # Auth API с лимит 10r/m
        location /api/auth/ {
            limit_req zone=auth_limit burst=2 nodelay;
            proxy_pass http://backend:8080/auth/;

            # Тъй като всичко е на deck.bg, CORS хедърите (Access-Control-Allow-Origin)
            # вече не са нужни и могат да бъдат премахнати за по-голяма сигурност.
        }

        # Game API
        location /api/game/ {
            limit_req zone=game_limit burst=10 nodelay;
            proxy_pass http://backend:8080/game/;
            proxy_set_header Authorization $http_authorization;
        }

        # WebSocket
        location /api/ws-game/ {
            limit_req zone=global_limit burst=5 nodelay;
            proxy_pass http://backend:8080/ws-game/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }
}