name: Build and Deploy to EC2 (Ubuntu 22 + Java 25)

on:
  push:
    branches:
      - master  # Trigger on push to master branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Build Spring Boot JAR
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/santase_backend:latest .

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/santase_backend:latest

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "docker-compose.yml,nginx.conf"
          target: "/home/ubuntu/app"

      - name: Deploy on EC2 (Ubuntu 22)
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            # 1. Move to the application directory
            cd /home/ubuntu/app

            echo "Logging into Docker Hub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "Creating environment file..."
            # Using quotes around 'EOF' prevents the shell from trying to interpret variables locally
            cat << 'EOF' > .env
            DB_URL_SANTASE=${{ secrets.DB_URL_SANTASE }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_DIALECT=${{ secrets.DB_DIALECT }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }}
            JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            SANTASE_MAIL_HOST=${{ secrets.SANTASE_MAIL_HOST }}
            SANTASE_MAIL_PORT=${{ secrets.SANTASE_MAIL_PORT }}
            SANTASE_MAIL_USERNAME=${{ secrets.SANTASE_MAIL_USERNAME }}
            SANTASE_MAIL_PASSWORD=${{ secrets.SANTASE_MAIL_PASSWORD }}
            EOF

            echo "Pulling latest images..."
            # This ensures you get the image you just pushed to Docker Hub
            docker compose pull

            echo "Restarting the containers..."
            # -d runs in background; --remove-orphans cleans up old service definitions
            docker compose up -d --force-recreate --remove-orphans

            echo "Cleaning up unused Docker data..."
            docker image prune -f