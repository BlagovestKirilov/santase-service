spring:
  profiles:
    active: dev

  application:
    name: SantaseService

  jackson:
    time-zone: Europe/Sofia

  datasource:
    url: ${DB_URL_SANTASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  threads:
    virtual:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: ${DB_DIALECT}
        jdbc:
          time_zone: Europe/Sofia

  mail:
    host: ${SANTASE_MAIL_HOST}
    port: ${SANTASE_MAIL_PORT}
    username: ${SANTASE_MAIL_USERNAME}
    password: ${SANTASE_MAIL_PASSWORD}

jwt:
  secret-key: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

# ============================================================
# DEV PROFILE
# ============================================================
---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    hikari:
      pool-name: SantaseHikariDev
      maximum-pool-size: 12
      minimum-idle: 4
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: false
      validation-timeout: 3000
      leak-detection-threshold: 20000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: ${DB_DIALECT}
        jdbc:
          time_zone: Europe/Sofia
logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE


# ============================================================
# PROD PROFILE
# ============================================================
---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      pool-name: SantaseHikariProd
      maximum-pool-size: 4
      minimum-idle: 2
      connection-timeout: 8000
      idle-timeout: 300000
      max-lifetime: 1700000
      keepalive-time: 300000
      auto-commit: false
      validation-timeout: 3000
      leak-detection-threshold: 15000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: ${DB_DIALECT}
        jdbc:
          time_zone: Europe/Sofia
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
