spring:
  profiles:
    active: dev

  application:
    name: SantaseService

  datasource:
    url: ${DB_URL_SANTASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: ${DB_DIALECT}
        jdbc:
          time_zone: UTC

jwt:
  secret-key: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

# ============================================================
# DEV PROFILE
# ============================================================
---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    hikari:
      pool-name: SantaseHikariDev
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000
      auto-commit: true
      validation-timeout: 5000
      leak-detection-threshold: 30000

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE


# ============================================================
# PROD PROFILE
# ============================================================
---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      pool-name: SantaseHikariProd
      maximum-pool-size: 6
      minimum-idle: 2
      connection-timeout: 20000      # 20s wait for connection
      idle-timeout: 300000           # 5 min
      max-lifetime: 1700000          # 28 min (safe for RDS / PG)
      auto-commit: false
      validation-timeout: 3000
      leak-detection-threshold: 20000
      keepalive-time: 300000

server:
  port: 8080
  tomcat:
    threads:
      max: 50
      min-spare: 10

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
