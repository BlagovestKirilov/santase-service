databaseChangeLog:
  - changeSet:
      id: init-schema
      author: Blagovest Kirilov

  - include:
      file: db/changelog/changes/009-add-email-confirmation-expired-status.yaml

  # NOTE: changes/001..008 exist on disk but are intentionally NOT included here.
  # Re-adding the includes risks Liquibase re-running CREATE TABLE users against
  # a live database if the recorded `filename` values do not match what this file
  # produces. Everything below is purely additive, so it applies cleanly.
  #
  # Known consequence: a brand-new empty database cannot be built from this
  # changelog alone. Restoring 001..008 means first reading production's
  # DATABASECHANGELOG and pinning logicalFilePath on each include to match it.
  #
  # Do NOT assume anything in 001..008 actually ran against production. It did
  # not for 007: its unique constraint on player.user_id was still present and
  # broke every new game until 014 dropped it. Verify against the live schema,
  # not against these files.

  - include:
      file: db/changelog/changes/010-add-game-type.yaml

  - include:
      file: db/changelog/changes/011-user-game-stats.yaml

  - include:
      file: db/changelog/changes/012-tabla-game-state.yaml

  - include:
      file: db/changelog/changes/013-tabla-dice-commitment.yaml

  - include:
      file: db/changelog/changes/014-drop-player-user-unique.yaml
