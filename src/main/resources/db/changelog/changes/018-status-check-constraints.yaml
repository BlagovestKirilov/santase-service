databaseChangeLog:
  # A status column carries a CHECK constraint listing the values it accepts.
  # Hibernate writes that constraint from the enum as it stood the day the
  # column was created, and `ddl-auto: update` never revises it — so an enum
  # that grows a value leaves a database that refuses it.
  #
  # forgot_password was found accepting only PENDING and SUCCESS, years after
  # ForgotPasswordStatus grew EXPIRED. Every attempt to retire a link was
  # rejected: the scheduled job first, but also the ordinary path where asking
  # for a second reset link ends the first. 009 fixed exactly this for
  # email_confirmation; this does the rest, and pins all three so the next enum
  # value is a changeset rather than a surprise.
  #
  # Safe on a live database: the constraint is only ever widened to the full set
  # of values the enum already has, so no existing row can fall outside it.
  #
  # The DO block drops every check constraint on the table that mentions the
  # status column, whatever it is called. A constraint created by an early
  # changeset may not carry Hibernate's naming, and DROP ... IF EXISTS on one
  # name would leave it in place and the table still refusing the value.
  - changeSet:
      id: 018-status-check-constraints
      author: Blagovest Kirilov
      comment: Every status column accepts every value its enum has
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DO $$
              DECLARE
                  target record;
                  allowed text;
              BEGIN
                  FOR target IN
                      SELECT * FROM (VALUES
                          ('forgot_password',    $v$'PENDING', 'EXPIRED', 'SUCCESS'$v$),
                          ('email_confirmation', $v$'PENDING', 'EXPIRED', 'CONFIRMED'$v$),
                          ('user_deletion',      $v$'PENDING', 'EXPIRED', 'SUCCESS'$v$)
                      ) AS t(table_name, values_list)
                  LOOP
                      CONTINUE WHEN NOT EXISTS (
                          SELECT 1 FROM information_schema.columns
                          WHERE table_schema = current_schema()
                            AND table_name = target.table_name
                            AND column_name = 'status'
                      );

                      -- Whatever the old constraint is called, it goes.
                      PERFORM 1;
                      EXECUTE (
                          SELECT coalesce(string_agg(
                              format('ALTER TABLE %I DROP CONSTRAINT %I;', target.table_name, conname), ' '),
                              'SELECT 1;')
                          FROM pg_constraint
                          WHERE contype = 'c'
                            AND conrelid = format('%I.%I', current_schema(), target.table_name)::regclass
                            AND pg_get_constraintdef(oid) ILIKE '%status%'
                      );

                      allowed := target.values_list;
                      EXECUTE format(
                          'ALTER TABLE %I ADD CONSTRAINT %I CHECK (status IN (%s));',
                          target.table_name, target.table_name || '_status_check', allowed
                      );
                  END LOOP;
              END $$;
      rollback:
        - sql:
            dbms: postgresql
            sql: SELECT 1;
